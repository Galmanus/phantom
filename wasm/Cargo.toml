[package]
name = "phantom-prover-wasm"
version = "1.0.0"
edition = "2021"
description = "PHANTOM ZK Prover WASM bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
phantom-prover = { path = "../circuits", default-features = false }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
